name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Syntax errors and pyflakes findings (unused imports, undefined names): the checks that
      # point at real bugs, without turning the codebase's comment style into a lint fight.
      - name: Lint
        run: ruff check app tests --select E9,F

      # No network and no API key: the AI providers are replaced by fakes.
      - name: Tests
        run: pytest

  frontend:
    name: Frontend (type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A clean install fails if package.json and the lock file disagree or if peer
      # dependencies cannot be resolved, which is worth catching on its own.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run ts-check

  docker:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: photo-damage-analyzer-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
